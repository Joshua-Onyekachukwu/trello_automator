name: Scan for unclaimed cards

on:
  schedule:
    # Every 5 minutes (free for public repos, once per 5 min limit)
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger scan endpoint
        run: |
          # Get a CRON_SECRET-compatible token for auth
          # The scan endpoint checks Authorization header for CRON_SECRET
          # If CRON_SECRET isn't set on Vercel, the auth check is skipped
          curl -sf --max-time 30 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://trello-automator.vercel.app/api/trello/scan" || true
